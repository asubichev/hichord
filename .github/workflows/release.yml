name: Release
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Skip if the merged PR has the no-release label
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[].labels[].name')
          if grep -qx "no-release" <<< "$labels"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR is labeled no-release; not publishing a release."
          fi
      - name: Version from VERSION file + run number
        if: steps.check.outputs.skip != 'true'
        run: echo "VERSION=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"
      - if: steps.check.outputs.skip != 'true'
        run: scripts/bundle.sh "$VERSION"
      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/HiChord.zip \
            --title "HiChord $VERSION" --generate-notes \
            --notes "Download **HiChord.zip**, unzip, then right-click HiChord.app → Open the first time (it's not notarized). Works on Apple Silicon and Intel Macs, macOS 13+."
